name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Install dependencies
        run: npm ci

      - name: Build library (ngx-print-pdf)
        run: npx ng build ngx-print-pdf

      - name: Build demo app
        run: npx ng build demo-app

      - name: Test library (ngx-print-pdf)
        run: npx ng test ngx-print-pdf --watch=false --browsers=ChromeHeadlessNoSandbox

      - name: Test demo app
        run: npx ng test demo-app --watch=false --browsers=ChromeHeadlessNoSandbox
